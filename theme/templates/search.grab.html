<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search: {query} — {site_title}</title>
  <link rel="stylesheet" href="{tokens_css_url}">
  <link rel="stylesheet" href="{theme_css_url}">
  <!-- @hook:theme_head_meta -->
</head>
<body>

  <main class="grex-main" data-grex-id="search-main">

      <p class="grex-muted">{results_summary}</p>

    <section class="grex-feed" data-grex-id="search-results" aria-label="Matching Entries">

    </section>
  </main>

  <!-- @part:footer -->

</html>
